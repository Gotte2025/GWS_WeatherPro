<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWS Weather Station - ThingSpeak</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .logo-text p {
            font-size: 11px;
            color: #00d4ff;
            margin: 2px 0 0 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background: rgba(0, 212, 255, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .time-display {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 4px;
        }

        .date-display {
            font-size: 12px;
            color: #aaa;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .metric-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .metric-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .metric-icon {
            font-size: 16px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .metric-secondary {
            font-size: 12px;
            color: #888;
        }

        .metric-card.temp { border-left: 3px solid #ff6b6b; }
        .metric-card.humidity { border-left: 3px solid #4dabf7; }
        .metric-card.thermal { border-left: 3px solid #ffa94d; }
        .metric-card.dew { border-left: 3px solid #51cf66; }
        .metric-card.alarm { border-left: 3px solid #ffd43b; }

        .full-width {
            grid-column: 1 / -1;
        }

        .charts-section {
            margin-bottom: 16px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
        }

        .recommendations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .recommendation {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .recommendation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        .recommendation-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .recommendation-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .recommendation-text {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .info-section {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .thermal-reference {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-size: 11px;
        }

        .thermal-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin: 8px 0;
        }

        .thermal-box {
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
        }

        .temp-extreme { background: linear-gradient(135deg, #ff0000, #cc0000); }
        .temp-hot { background: linear-gradient(135deg, #ff6b6b, #ff5252); }
        .temp-warm { background: linear-gradient(135deg, #ffa94d, #ff9800); }
        .temp-moderate { background: linear-gradient(135deg, #51cf66, #4caf50); }
        .temp-cool { background: linear-gradient(135deg, #4dabf7, #2196f3); }
        .temp-cold { background: linear-gradient(135deg, #1971c2, #0d47a1); }
        .temp-very-cold { background: linear-gradient(135deg, #0d47a1, #051d3d); }

        .update-info {
            text-align: center;
            font-size: 11px;
            color: #888;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .metric-card {
                grid-column: auto;
            }

            .recommendations {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }

            .logo {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🌐</div>
                <div class="logo-text">
                    <h1>GWS Weather</h1>
                    <p>IoT Meteorológica</p>
                </div>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="statusText">Conectando...</span>
            </div>
        </div>

        <div id="content" class="loading">
            <div class="spinner"></div>
            <p>Cargando datos de ThingSpeak...</p>
        </div>
    </div>

    <script>
        const CHANNEL_ID = '2879152';
        const API_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json`;
        const RESULTS = 100;

        let tempChart, humidityChart;
        let allData = [];

        async function fetchThingSpeakData() {
            try {
                const response = await fetch(`${API_URL}?results=${RESULTS}`);
                const data = await response.json();
                
                if (data.feeds && data.feeds.length > 0) {
                    allData = data.feeds.reverse();
                    updateDashboard(data.channel, allData);
                    document.getElementById('statusText').textContent = 'En línea';
                    document.getElementById('statusText').parentElement.style.borderColor = 'rgba(0, 255, 0, 0.3)';
                    return true;
                }
            } catch (error) {
                console.error('Error fetching ThingSpeak data:', error);
                document.getElementById('statusText').textContent = 'Error de conexión';
                document.getElementById('statusText').parentElement.style.borderColor = 'rgba(255, 107, 107, 0.3)';
            }
            return false;
        }

        function updateDashboard(channel, feeds) {
            const latestFeed = feeds[feeds.length - 1];
            
            let temp = parseFloat(latestFeed.field1) || 24.8;
            let humidity = parseFloat(latestFeed.field2) || 72;
            let thermalSensation = temp + (humidity / 100) * 2;
            let dewPoint = temp - ((100 - humidity) / 5);

            // Estado de alarma a partir de field7
            const alarmRaw = latestFeed.field7;
            const hasAlarmData = alarmRaw !== null && alarmRaw !== undefined && alarmRaw !== '';

            // Log solo visible en la consola del navegador (F12), no en la página,
            // para poder verificar qué está llegando realmente desde ThingSpeak.
            console.log('field7 (valor crudo recibido):', alarmRaw);

            let alarmActive = false;
            if (hasAlarmData) {
                const normalized = String(alarmRaw).trim().toLowerCase();
                const numeric = parseFloat(normalized);
                if (!isNaN(numeric)) {
                    alarmActive = numeric !== 0;
                } else {
                    const activeValues = ['on', 'true', 'alarma', 'activa', 'activo', 'alert', 'alerta', 'si', 'sí', '1'];
                    alarmActive = activeValues.includes(normalized);
                }
            }

            let alarmStatusText, alarmStatusColor, alarmSecondaryText;
            if (!hasAlarmData) {
                alarmStatusText = 'SIN DATOS';
                alarmStatusColor = '#888888';
                alarmSecondaryText = 'Sensor no disponible';
            } else if (alarmActive) {
                alarmStatusText = 'ALARMA';
                alarmStatusColor = '#ff6b6b';
                alarmSecondaryText = 'Alerta activa - revisar sistema';
            } else {
                alarmStatusText = 'NORMAL';
                alarmStatusColor = '#ffd43b';
                alarmSecondaryText = 'Sin alertas activas';
            }

            const html = `
                <div class="metrics-grid">
                    <div class="metric-card temp">
                        <div class="metric-label">
                            <span class="metric-icon">🌡️</span>
                            Temperatura
                        </div>
                        <div class="metric-value">${temp.toFixed(1)}°C</div>
                        <div class="metric-secondary">${(temp * 9/5 + 32).toFixed(1)}°F</div>
                    </div>

                    <div class="metric-card humidity">
                        <div class="metric-label">
                            <span class="metric-icon">💧</span>
                            Humedad
                        </div>
                        <div class="metric-value">${humidity.toFixed(0)}%</div>
                        <div class="metric-secondary">Relativa</div>
                    </div>

                    <div class="metric-card thermal">
                        <div class="metric-label">
                            <span class="metric-icon">👤</span>
                            Sensación Térmica
                        </div>
                        <div class="metric-value">${thermalSensation.toFixed(1)}°C</div>
                        <div class="metric-secondary">Percibida</div>
                    </div>

                    <div class="metric-card dew">
                        <div class="metric-label">
                            <span class="metric-icon">🌧️</span>
                            Punto de Rocío
                        </div>
                        <div class="metric-value">${Math.max(dewPoint, 0).toFixed(1)}°C</div>
                        <div class="metric-secondary">Condensación</div>
                    </div>

                    <div class="metric-card alarm full-width" style="border-left-color: ${alarmStatusColor};">
                        <div class="metric-label">
                            <span class="metric-icon">⚠️</span>
                            Estado de Alarma
                        </div>
                        <div class="metric-value" style="color: ${alarmStatusColor};">${alarmStatusText}</div>
                        <div class="metric-secondary">${alarmSecondaryText}</div>
                    </div>
                </div>

                <div class="charts-section">
                    <div class="chart-container">
                        <div class="chart-title">📊 Histórico de Temperatura (°C)</div>
                        <div style="position: relative; height: 240px;">
                            <canvas id="tempChart" role="img" aria-label="Gráfica de temperatura histórica"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <div class="chart-title">💧 Histórico de Humedad (%)</div>
                        <div style="position: relative; height: 240px;">
                            <canvas id="humidityChart" role="img" aria-label="Gráfica de humedad histórica"></canvas>
                        </div>
                    </div>
                </div>

                <div class="recommendations">
                    ${humidity > 70 ? `
                    <div class="recommendation">
                        <div class="recommendation-icon">☔</div>
                        <div class="recommendation-title">Día Húmedo</div>
                        <div class="recommendation-text">Llevar paraguas. Posible lluvia.</div>
                    </div>
                    ` : `
                    <div class="recommendation">
                        <div class="recommendation-icon">☀️</div>
                        <div class="recommendation-title">Día Soleado</div>
                        <div class="recommendation-text">Ideal para actividades al aire libre.</div>
                    </div>
                    `}
                    
                    ${temp > 28 ? `
                    <div class="recommendation">
                        <div class="recommendation-icon">🌡️</div>
                        <div class="recommendation-title">Calor</div>
                        <div class="recommendation-text">Beber agua. Usar protector solar.</div>
                    </div>
                    ` : `
                    <div class="recommendation">
                        <div class="recommendation-icon">🧥</div>
                        <div class="recommendation-title">Templado</div>
                        <div class="recommendation-text">Abrigo ligero recomendado.</div>
                    </div>
                    `}
                </div>

                <div class="thermal-reference">
                    <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">Referencia de Sensación Térmica:</div>
                    <div class="thermal-bar">
                        <div class="thermal-box temp-extreme" title="> 40 °C">Extremo</div>
                        <div class="thermal-box temp-hot" title="35-40 °C">Mucho calor</div>
                        <div class="thermal-box temp-warm" title="28-35 °C">Calor</div>
                        <div class="thermal-box temp-moderate" title="20-28 °C">Moderada</div>
                        <div class="thermal-box temp-cool" title="15-20 °C">Fresca</div>
                    </div>
                </div>

                <div class="info-section">
                    <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">Información Adicional</div>
                    <div class="info-item">
                        <span class="info-label">Última actualización:</span>
                        <span class="info-value">${new Date(latestFeed.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Frecuencia:</span>
                        <span class="info-value">15 segundos</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Canal ID:</span>
                        <span class="info-value">${CHANNEL_ID}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fuente:</span>
                        <span class="info-value">ThingSpeak API</span>
                    </div>
                </div>

                <div class="update-info">
                    Datos actualizados en tiempo real cada 15 segundos
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            // Initialize charts after DOM is ready
            setTimeout(() => {
                initCharts(feeds);
            }, 100);
        }

        function initCharts(feeds) {
            const chartData = feeds.map(f => ({
                time: new Date(f.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                temp: parseFloat(f.field1) || 0,
                humidity: parseFloat(f.field2) || 0
            }));

            // Temperature Chart
            const tempCtx = document.getElementById('tempChart');
            if (tempCtx) {
                if (tempChart) tempChart.destroy();
                tempChart = new Chart(tempCtx, {
                    type: 'line',
                    data: {
                        labels: chartData.map(d => d.time),
                        datasets: [{
                            label: 'Temperatura °C',
                            data: chartData.map(d => d.temp),
                            borderColor: '#ff6b6b',
                            backgroundColor: 'rgba(255, 107, 107, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#ff6b6b',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { color: '#aaa', font: { size: 11 } },
                                border: { display: false }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#aaa', font: { size: 10 }, maxTicksLimit: 5 },
                                border: { display: false }
                            }
                        }
                    }
                });
            }

            // Humidity Chart
            const humidityCtx = document.getElementById('humidityChart');
            if (humidityCtx) {
                if (humidityChart) humidityChart.destroy();
                humidityChart = new Chart(humidityCtx, {
                    type: 'line',
                    data: {
                        labels: chartData.map(d => d.time),
                        datasets: [{
                            label: 'Humedad %',
                            data: chartData.map(d => d.humidity),
                            borderColor: '#4dabf7',
                            backgroundColor: 'rgba(77, 171, 247, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#4dabf7',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { color: '#aaa', font: { size: 11 } },
                                border: { display: false }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#aaa', font: { size: 10 }, maxTicksLimit: 5 },
                                border: { display: false }
                            }
                        }
                    }
                });
            }
        }

        // Initial load
        fetchThingSpeakData();

        // Auto-refresh every 15 seconds
        setInterval(fetchThingSpeakData, 15000);

        // Update clock
        function updateClock() {
            const now = new Date();
            if (document.querySelector('.time-display')) {
                document.querySelector('.time-display').textContent = 
                    now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
